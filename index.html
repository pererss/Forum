<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nuffy — многофункциональная платформа сообщества: обсуждения, статьи, вопросы и ответы, поиск команды, проекты, события и опросы." />
    <meta name="theme-color" content="#0b0b0e" />
    <title>Nuffy — сообщество</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nuffy-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nuffy требует включённый JavaScript.</noscript>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
